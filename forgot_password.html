<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_Chain - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="registration-container-wrapper">
    <div class="registration-container">
        <img src="logo.png" alt="B_Chain Logo" class="logo">
        <h2>Reset Password</h2>
        <p style="font-size: 0.9em; color: #666; margin-bottom: 20px;">Enter your username, registered contact (e.g. 07... or +256...), and new password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Your username">
            </div>
            <div class="form-group">
                <label for="contact">Registered Contact Number</label>
                <input type="text" id="contact" name="contact" required placeholder="e.g. 0770000000 or +25677...">
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="password" required placeholder="Enter new password">
            </div>
            <button type="submit" class="register-button">Request Reset</button>
        </form>
        <a href="login.html" class="login-link">Back to Login</a>
    </div>
    <footer>
        <p>&copy; 2026 B_Chain Waste Management System. All Rights Reserved.</p>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
