<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance - B_Chain</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body style="background-color: #f4f7f6;">
    <div class="registration-container" style="max-width: 600px;">
        <img src="logo.png" alt="B_Chain Logo" class="logo">
        <h1 style="color: #c62828; margin-bottom: 20px;">System Under Maintenance</h1>
        <div id="maintenance-display">
            <p style="color: #555; font-size: 1.2em; line-height: 1.6;" id="maint-text">
                Loading maintenance details...
            </p>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        <a href="login.html" class="register-button" style="display: inline-block; text-decoration: none; width: auto; padding: 12px 40px; background-color: #3F51B5;">Admin Login</a>
    </div>

    <script>
        // Fetch the broadcast message directly
        fetch('http://127.0.0.1:5000/api/settings/maintenance_message')
            .then(res => res.json())
            .then(data => {
                document.getElementById('maint-text').innerText = data.value || "The system is currently offline for planned maintenance. Please check back later.";
            }).catch(() => {
                document.getElementById('maint-text').innerText = "The system is currently offline for planned maintenance.";
            });
    </script>
</body>
</html>
