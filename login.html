<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_Chain - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="registration-container-wrapper">
    <div class="registration-container">
        <img src="logo.png" alt="B_Chain Logo" class="logo">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="register-button">Login</button>
        </form>
        <a href="forgot_password.html" class="login-link" style="margin-top: 10px; font-size: 0.85em; opacity: 0.8;">Forgot password?</a>
        <a href="register.html" class="login-link">New here? Create an account</a>
    </div>

    <footer>
        <p>&copy; 2026 B_Chain Waste Management System. All Rights Reserved.</p>
        <p>Designed for the Nakawa Division Community.</p>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
